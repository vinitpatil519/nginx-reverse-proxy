# Nginx in front of two app replicas — load balancing, health-gated startup,
# rate limiting, and a backend that is never published to the host.
# Docs: ../../docs/06-networking.md · ../../docs/12-production-workflow.md

name: example-proxy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"                                    # the ONLY published port
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [frontend]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  app:
    build: .
    restart: unless-stopped
    init: true
    # No `ports:` — reachable only through nginx, on the compose network.
    expose:
      - "8000"
    environment:
      APP_NAME: backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [frontend]
    deploy:
      replicas: 2                                    # nginx round-robins between them
      resources:
        limits: {cpus: "0.25", memory: 128M}

networks:
  frontend:
