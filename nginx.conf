# Reverse proxy in front of the `app` replicas.
# Docs: ../../docs/06-networking.md

# Rate limiting: 10 requests/second per client IP, bursts of 20 allowed.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Docker's embedded DNS. Re-resolving every 10s is what lets nginx pick up new
# replicas — with a static `upstream { server app:8000; }` block nginx resolves
# once at startup and keeps talking to whichever container answered first.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;      # logs to the Docker log driver, not to a file
    error_log  /dev/stderr warn;

    # Proxy's own health — does not depend on the backend.
    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        # A variable in proxy_pass forces per-request DNS resolution, so the
        # round-robin actually rotates across replicas.
        set $backend "app:8000";
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;   # correlates proxy and app logs

        proxy_connect_timeout 3s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;
    }

    # Security headers you would also set in production.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY   always;
}
